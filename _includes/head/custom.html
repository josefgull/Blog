<style>
  .slideshow { position: relative; margin: 1em 0 2em; background: #111; border-radius: 4px; overflow: hidden; }
  .slideshow__track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .slideshow__track::-webkit-scrollbar { display: none; }
  .slideshow__slide { flex: 0 0 100%; margin: 0; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; height: min(70vh, 600px); }
  .slideshow__slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slideshow__btn { position: absolute; top: 50%; transform: translateY(-50%); width: 2.5em; height: 2.5em; border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 1.4em; line-height: 1; cursor: pointer; }
  .slideshow__btn:hover { background: rgba(0, 0, 0, 0.8); }
  .slideshow__btn--prev { left: 0.5em; }
  .slideshow__btn--next { right: 0.5em; }
  .slideshow__count { position: absolute; bottom: 0.5em; right: 0.75em; padding: 0.1em 0.6em; border-radius: 1em; background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 0.7em; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".slideshow").forEach(function (show) {
      var track = show.querySelector(".slideshow__track");
      var count = show.querySelector(".slideshow__count");
      var total = track.children.length;
      function current() { return Math.round(track.scrollLeft / track.clientWidth); }
      function go(i) { track.scrollTo({ left: ((i + total) % total) * track.clientWidth }); }
      show.querySelector(".slideshow__btn--prev").addEventListener("click", function () { go(current() - 1); });
      show.querySelector(".slideshow__btn--next").addEventListener("click", function () { go(current() + 1); });
      track.addEventListener("scroll", function () { count.textContent = (current() + 1) + " / " + total; });
    });
  });
</script>
